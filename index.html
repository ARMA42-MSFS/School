<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#312e81"><meta name="description" content="ReservePilot – schlanke Einsatzplanung für mobile Reservelehrkräfte"><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="stylesheet" href="app.css"><title>ReservePilot V2.10</title></head><body>
<div id="app"><header class="app-header"><div class="brand"><img src="icon-192.png" alt="" class="brand-icon"><div><small>RESERVEPILOT V2.10</small><h1>Einsatzplaner</h1><p id="todayLabel"></p></div></div></header>
<main>
<section id="page-plan" class="page active">
 <article class="card next-card"><div class="kicker">NÄCHSTER EINSATZ</div><h2 id="nextTitle">Noch kein Einsatz geplant</h2><p id="nextDetails" class="muted">Plane deinen nächsten Einsatz direkt im Kalender.</p><div id="nextActions" class="actions hidden"><button id="nextRoute">🧭 Route</button><button id="nextCall">☎ Anrufen</button></div></article>
 <article class="card"><div class="row"><button id="prevMonth" class="icon-btn" aria-label="Vorheriger Monat">‹</button><div class="center"><div class="kicker">PLANUNG</div><h2 id="calendarTitle"></h2></div><button id="nextMonth" class="icon-btn" aria-label="Nächster Monat">›</button></div><button id="newEntry" class="primary full">＋ Einsatz planen</button><div class="calendar-head"><b>Mo</b><b>Di</b><b>Mi</b><b>Do</b><b>Fr</b><b>Sa</b><b>So</b></div><div id="calendar" class="calendar"></div><p class="legend"><span class="dot"></span> Einsatz &nbsp; <span class="today-ring"></span> Heute</p></article>
 <article class="card"><div class="row"><div><div class="kicker">EINSATZNOTIZEN</div><h2>Notizen zum Einsatz</h2></div></div><label>Einsatz<select id="noteEntry"></select></label><label>Notiz<textarea id="noteText" placeholder="Notizen zu diesem Einsatz …"></textarea></label><div class="actions"><button id="saveNote" class="primary">Speichern</button><button id="deleteNote" class="danger">Notiz löschen</button></div><p id="noteMessage" class="muted"></p></article>
</section>
<section id="page-schools" class="page"><article class="card"><div class="kicker">SCHULVERZEICHNIS</div><h2>🏫 Schulen</h2><input id="schoolSearch" placeholder="🔎 Schule suchen"><div id="schoolList"></div></article></section>
<section id="page-month" class="page"><article class="card"><div class="kicker">AKTUELLER MONAT</div><h2 id="monthTitle"></h2><div id="monthStats" class="stats"></div></article><article class="card"><h2>Einsätze</h2><div id="monthList"></div></article></section>
</main>
<nav class="bottom-nav"><button data-page="plan" class="active">📅<span>Planung</span></button><button data-page="schools">🏫<span>Schulen</span></button><button data-page="month">📊<span>Monat</span></button></nav></div>
<dialog id="entryDialog"><form id="entryForm"><div class="row"><h2 id="entryDialogTitle">Einsatz planen</h2><button type="button" id="closeEntry" class="icon-btn">×</button></div><label>Datum<input id="entryDate" type="date" required></label><label>Schule<select id="entrySchool" required></select></label><div id="schoolInfo" class="info"></div><div class="form-grid"><label>Klasse<input id="entryClass" placeholder="z. B. 3b"></label><label>Raum<input id="entryRoom" placeholder="optional"></label><label>Von<input id="entryFrom" type="time" value="08:00"></label><label>Bis<input id="entryTo" type="time" value="12:15"></label><label>Unterrichtsstunden<input id="entryPeriods" type="number" min="1" max="12" value="4"></label><label>Fächer<input id="entrySubjects" placeholder="optional"></label></div><label>Notiz<textarea id="entryNote" placeholder="Notiz direkt diesem Einsatz zuordnen …"></textarea></label><div class="actions"><button type="button" id="deleteEntry" class="danger hidden">Einsatz löschen</button><button type="submit" class="primary">Einsatz speichern</button></div></form></dialog>
<script src="app.js"></script></body></html>
